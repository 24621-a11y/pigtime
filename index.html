<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전기 진로 공학 계산기 (AI TTS 통합형)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #cfd8dc, #eceff1);
      font-family: Arial, sans-serif;
      padding: 40px 0;
    }

    .calculator-container {
      width: 400px;
      padding: 24px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 22px;
      color: #1a237e;
    }

    /* 탭 메뉴 스타일 */
    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      font-size: 14px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      color: #757575;
      transition: 0.2s;
      height: auto;
      border-radius: 0;
    }

    .tab-btn:hover {
      transform: none;
      background: #f5f5f5;
    }

    .tab-btn.active {
      color: #1a237e;
      font-weight: bold;
      border-bottom-color: #1a237e;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 일반 계산기 스타일 */
    #display {
      width: 100%;
      height: 64px;
      margin-bottom: 16px;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: #f4f6f8;
      font-size: 28px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 54px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
      background: #edf1f5;
      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #dde5ec;
    }

    .operator {
      background: #bbdefb;
      color: #0d47a1;
      font-weight: bold;
    }

    .equal {
      background: #1a237e;
      color: white;
      font-weight: bold;
      grid-column: span 2;
    }

    .clear {
      background: #ef5350;
      color: white;
      font-weight: bold;
    }

    .zero {
      grid-column: span 2;
    }

    /* 전기 전용 계산기 폼 스타일 */
    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .elec-btn {
      width: 100%;
      background: #1a237e;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }

    .result-box {
      margin-top: 15px;
      padding: 12px;
      background: #f1f3f9;
      border-radius: 10px;
      font-size: 15px;
      color: #1a237e;
      font-weight: bold;
      text-align: center;
      min-height: 45px;
    }

    .guide {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }

    /* --- AI TTS 연동 구역 디자인 추가 --- */
    .tts-divider {
      margin: 24px 0 16px;
      border: 0;
      border-top: 2px dashed #cfd8dc;
    }

    .tts-title {
      font-size: 15px;
      color: #1a237e;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .tts-option-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tts-option-box select, .tts-option-box input {
      height: 38px;
      padding: 0 10px;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
