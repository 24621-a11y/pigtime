<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전기 AI 박사 & TTS 시스템</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eceff1, #cfd8dc);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 28px;
      color: #1a237e;
    }

    .subtitle {
      text-align: center;
      color: #5c6bc0;
      margin-bottom: 24px;
      font-size: 15px;
      font-weight: 500;
    }

    .info {
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #e8eaf6;
      color: #1a237e;
      font-size: 14px;
      line-height: 1.6;
      border-left: 5px solid #3f51b5;
    }

    .option-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    select, input {
      height: 44px;
      padding: 0 12px;
      border: 1px solid #c5cae9;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background-color: #fca;
      background: #fff;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #c5cae9;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      font-family: Arial, sans-serif;
    }

    textarea:focus, select:focus, input:focus {
      border-color: #3f51b5;
      box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.15);
    }

    .label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #1a237e;
      margin-top: 14px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button, .download-link {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, .download-link:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .make-btn {
      background: #3f51b5;
      color: white;
    }

    .clear-btn {
      background: #b0bec5;
      color: white;
    }

    .download-link {
      background: #00796b;
      color: white;
    }

    .hidden { display: none; }

    .status {
      min-height: 24px;
      margin-top: 14px;
      color: #e65100;
      font-size: 14px;
      font-weight: bold;
    }

      padding: 20px;

      background
