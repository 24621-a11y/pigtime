<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전기 진로 공학 계산기 (AI TTS 통합형)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #cfd8dc, #eceff1);
      font-family: Arial, sans-serif;
      padding: 20px 0;
    }

    .calculator-container {
      width: 380px;
      padding: 24px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 22px;
      color: #1a237e;
    }

    /* 탭 메뉴 스타일 */
    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      font-size: 14px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      color: #757575;
      transition: 0.2s;
      height: auto;
      border-radius: 0;
    }

    .tab-btn:hover {
      transform: none;
      background: #f5f5f5;
    }

    .tab-btn.active {
      color: #1a237e;
      font-weight: bold;
      border-bottom-color: #1a237e;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 일반 계산기 스타일 */
    #display {
      width: 100%;
      height: 64px;
      margin-bottom: 16px;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: #f4f6f8;
      font-size: 28px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 54px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
      background: #edf1f5;
      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #dde5ec;
    }

    .operator {
      background: #bbdefb;
      color: #0d47a1;
      font-weight: bold;
    }

    .equal {
      background: #1a237e;
      color: white;
      font-weight: bold;
      grid-column: span 2;
    }

    .clear {
      background: #ef5350;
      color: white;
      font-weight: bold;
    }

    .zero {
      grid-column: span 2;
    }

    /* 전기 전용 계산기 폼 스타일 */
    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .elec-btn {
      width: 100%;
      background: #1a237e;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }

    .result-box {
      margin-top: 15px;
      padding: 12px;
      background: #f1f3f9;
      border-radius: 10px;
      font-size: 15px;
      color: #1a237e;
      font-weight: bold;
      text-align: center;
      min-height: 45px;
    }

    .guide {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }

    /* --- TTS 컴포넌트 추가 스타일 --- */
    .tts-divider {
      margin: 20px 0 15px;
      border: 0;
      border-top: 2px dashed #d1d5db;
    }

    .tts-section-title {
      font-size: 14px;
      color: #1a237e;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .tts-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tts-options select, .tts-options input {
      height: 36px;
      padding: 0 8px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .status-text {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 5px;
      min-height: 18px;
    }

    .audio-container {
      margin-top: 10px;
      background: #f9fafb;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    audio {
      width: 100%;
      height: 32px;
    }

    .dl-btn-wrapper {
      margin-top: 8px;
      text-align: right;
    }

    .download-link {
      font-size: 12px;
      color: #7e57c2;
      text-decoration: none;
      font-weight: bold;
    }

    .download-link:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="calculator-container">
    <h1>전기 진로 공학 계산기</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="openTab('general')">일반</button>
      <button class="tab-btn" onclick="openTab('ohm')">옴/전력</button>
      <button class="tab-btn" onclick="openTab('thd')">왜형률</button>
    </div>

    <div id="general" class="tab-content active">
      <input id="display" type="text" placeholder="0" readonly />
      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="addToDisplay('%')">%</button>
        <button class="operator" onclick="addToDisplay('/')">÷</button>

        <button onclick="addToDisplay('7')">7</button>
        <button onclick="addToDisplay('8')">8</button>
        <button onclick="addToDisplay('9')">9</button>
        <button class="operator" onclick="addToDisplay('*')">×</button>

        <button onclick="addToDisplay('4')">4</button>
        <button onclick="addToDisplay('5')">5</button>
        <button onclick="addToDisplay('6')">6</button>
        <button class="operator" onclick="addToDisplay('-')">−</button>

        <button onclick="addToDisplay('1')">1</button>
        <button onclick="addToDisplay('2')">2</button>
        <button onclick="addToDisplay('3')">3</button>
        <button class="operator" onclick="addToDisplay('+')">+</button>

        <button class="zero" onclick="addToDisplay('0')">0</button>
        <button onclick="addToDisplay('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
      <div class="guide">키보드 숫자와 연산자도 사용할 수 있습니다.</div>
    </div>

    <div id="ohm" class="tab-content">
      <div class="input-group">
        <label>구하고자 하는 값 선택</label>
        <select id="ohmType" onchange="toggleOhmInputs()">
          <option value="V">전압 (V) 구하기</option>
          <option value="I">전류 (I) 구하기</option>
          <option value="R">저항 (R) 구하기</option>
          <option value="P">전력 (P) 구하기</option>
        </select>
      </div>
      <div id="ohmInputs"></div>
      <button class="elec-btn" onclick="calculateOhm()">계산하기</button>
      <div class="result-box" id="ohmResult">결과가 여기에 표시됩니다.</div>
    </div>

    <div id="thd" class="tab-content">
      <div class="input-group">
        <label>기본파 성분의 실효값 (값만 입력)</label>
        <input type="number" id="fundVal" placeholder="예: 100" />
      </div>
      <div class="input-group">
        <label>전체 고조파 성분의 실효값 (값만 입력)</label>
        <input type="number" id="harmVal" placeholder="예: 5" />
      </div>
      <button class="elec-btn" onclick="calculateTHD()">THD 계산하기</button>
      <div class="result-box" id="thdResult">결과가 여기에 표시됩니다.</div>
    </div>

    <hr class="tts-divider" />
    <div class="tts-section-title">🔊 AI 음성 안내 설정</div>
    
    <div class="tts-options">
      <select id="modelSelect">
        <option value="tts-1">tts-1 빠른 생성</option>
        <option value="tts-1-hd">tts-1-hd 고품질</option>
      </select>

      <select id="voiceSelect">
        <option value="alloy" selected>alloy</option>
        <option value="echo">echo</option>
        <option value="fable">fable</option>
        <option value="onyx">onyx</option>
        <option value="nova">nova</option>
        <option value="shimmer">shimmer</option>
      </select>
    </div>
    
    <div class="tts-options" style="grid-template-columns: 1fr;">
      <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" placeholder="말하기 속도 (0.25 ~ 4.0)" />
    </div>

    <div id="status" class="status-text">계산하면 AI 음성이 자동으로 읽어줍니다.</div>

    <div id="resultBox" class="audio-container hidden">
      <audio id="audioPlayer" controls></audio>
      <div class="dl-btn-wrapper">
        <a id="downloadLink" class="download-link" href="#" download="tts-audio.mp3">다운로드 (mp3)</a>
      </div>
    </div>

  </div>

  <script>
    // --- Google Apps Script URL ---
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxDNMIktE288seW2Mr5YgksYFeAP3SNl8YyQZFa1DuvD0N_8pjRLDmxkZBYyQ4WGPmt/exec';

    // TTS 컴포넌트 DOM 객체
    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedInput = document.getElementById('speedInput');
    const statusBox = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    // --- 탭 전환 로직 ---
    function openTab(tabId) {
      const contents = document.querySelectorAll('.tab-content');
      const tabs = document.querySelectorAll('.tab-btn');
      
      contents.forEach(content => content.classList.remove('active'));
      tabs.forEach(tab => tab.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // --- 1. 일반 계산기 로직 ---
    const display = document.getElementById('display');

    function addToDisplay(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        if (display.value.trim() === '') return;
        const result = Function('return ' + display.value)();
        display.value = result;
        
        // TTS 연동: 결과값 읽기
        generateTTS(`결과는 ${result} 입니다.`);
      } catch (error) {
        display.value = '오류';
        generateTTS("계산 오류가 발생했습니다.");
        setTimeout(clearDisplay, 1000);
      }
    }

    document.addEventListener('keydown', function(event) {
      if(!document.getElementById('general').classList.contains('active')) return;
      
      const key = event.key;
      if (!isNaN(key) || ['+', '-', '*', '/', '.', '%'].includes(key)) {
        addToDisplay(key);
      } else if (key === 'Enter') {
        calculate();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });

    // --- 2. 옴의 법칙 / 전력 계산 로직 ---
    function toggleOhmInputs() {
      const type = document.getElementById('ohmType').value;
      const container = document.getElementById('ohmInputs');
      let html = '';

      if (type === 'V') {
        html = `
          <div class="input-group"><label>전류 I (A)</label><input type="number" id="input1"></div>
          <div class="input-group"><label>저항 R (Ω)</label><input type="number" id="input2"></div>`;
      } else if (type === 'I') {
        html = `
          <div class="input-group"><label>전압 V (V)</label><input type="number" id="input1"></div>
          <div class="input-group"><label>저항 R (Ω)</label><input type="number" id="input2"></div>`;
      } else if (type === 'R') {
        html = `
          <div class="input-group"><label>전압 V (V)</label><input type="number" id="input1"></div>
          <div class="input-group"><label>전류 I (A)</label><input type="number" id="input2"></div>`;
      } else if (type === 'P') {
        html = `
          <div class="input-group"><label>전압 V (V)</label><input type="number" id="input1"></div>
          <div class="input-group"><label>전류 I (A)</label><input type="number" id="input2"></div>`;
      }
      container.innerHTML = html;
    }

    function calculateOhm() {
      const type = document.getElementById('ohmType').value;
      const val1 = parseFloat(document.getElementById('input1')?.value);
      const val2 = parseFloat(document.getElementById('input2')?.value);
      const resultBox = document.getElementById('ohmResult');

      if (isNaN(val1) || isNaN(val2)) {
        const errorMsg = '올바른 값을 입력해주세요.';
        resultBox.innerText = errorMsg;
        generateTTS(errorMsg);
        return;
      }

      let result = 0;
      let ttsText = '';
      
      if (type === 'V') {
        result = val1 * val2;
        resultBox.innerText = `전압(V) = ${result.toFixed(2)} V`;
        ttsText = `계산된 전압은 ${result.toFixed(2)} 볼트입니다.`;
      } else if (type === 'I') {
        if(val2 === 0) { 
          resultBox.innerText = '저항은 0이 될 수 없습니다.'; 
          generateTTS('저항은 0이 될 수 없습니다.');
          return; 
        }
        result = val1 / val2;
        resultBox.innerText = `전류(I) = ${result.toFixed(2)} A`;
        ttsText = `계산된 전류는 ${result.toFixed(2)} 암페어입니다.`;
      } else if (type === 'R') {
        if(val2 === 0) { 
          resultBox.innerText = '전류는 0이 될 수 없습니다.'; 
          generateTTS('전류는 0이 될 수 없습니다.');
          return; 
        }
        result = val1 / val2;
        resultBox.innerText = `저항(R) = ${result.toFixed(2)} Ω`;
        ttsText = `계산된 저항은 ${result.toFixed(2)} 옴입니다.`;
      } else if (type === 'P') {
        result = val1 * val2;
        resultBox.innerText = `전력(P) = ${result.toFixed(2)} W`;
        ttsText = `계산된 전력은 ${result.toFixed(2)} 와트입니다.`;
      }
      
      // TTS 생성 요청
      generateTTS(ttsText);
    }

    // --- 3. 왜형률(THD) 계산 로직 ---
    function calculateTHD() {
      const fund = parseFloat(document.getElementById('fundVal').value);
      const harm = parseFloat(document.getElementById('harmVal').value);
      const resultBox = document.getElementById('thdResult');

      if (isNaN(fund) || isNaN(harm)) {
        resultBox.innerText = '올바른 값을 입력해주세요.';
        generateTTS('올바른 값을 입력해주세요.');
        return;
      }
      if (fund === 0) {
        resultBox.innerText = '기본파는 0이 될 수 없습니다.';
        generateTTS('기본파는 0이 될 수 없습니다.');
        return;
      }

      const thd = (harm / fund) * 100;
      resultBox.innerText = `왜형률(THD) = ${thd.toFixed(2)} %`;
      
      // TTS 생성 요청
      generateTTS(`계산된 왜형률은 ${thd.toFixed(2)} 퍼센트입니다.`);
    }

    // --- 4. 공통 AI TTS 음성 변환 및 재생 엔진 ---
    async function generateTTS(textToSpeak) {
      const model = modelSelect.value;
      const voice = voiceSelect.value;
      const speed = Number(speedInput.value || 1.0);

      if (!textToSpeak) return;

      if (speed < 0.25 || speed > 4.0) {
        alert('속도는 0.25부터 4.0 사이로 입력해주세요.');
        return;
      }

      try {
        resultBox.classList.add('hidden');
        statusBox.textContent = 'AI 음성 생성 중...';

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'tts',
            text: textToSpeak,
            model: model,
            voice: voice,
            speed: speed
          })
        });

        const data = await response.json();

        if (data.error) throw new Error(data.error);
        if (!data.audioBase64) throw new Error('음성 데이터를 받지 못했습니다.');

        const audioUrl = base64ToAudioUrl(data.audioBase64, 'audio/mpeg');

        // 플레이어 세팅 및 재생
        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        downloadLink.download = makeFileName();
        
        resultBox.classList.remove('hidden');
        statusBox.textContent = '🔊 음성 안내 재생 중';
        
        // 자동 재생 호출
        audioPlayer.play().catch(e => {
          console.log("자동 재생이 브라우저에 의해 차단되었습니다. 재생 버튼을 눌러주세요.");
          statusBox.textContent = '음성 생성 완료 (재생 버튼 클릭)';
        });

      } catch (error) {
        console.error(error);
        statusBox.textContent = '음성 생성 실패';
      }
    }

    // 데이터 변환 유틸 함수들
    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];

      for (let offset =
