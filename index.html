<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ 전기 AI 박사 & TTS 상담소 (데이터 관리형)</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 28px;
      color: #1a237e;
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
      color: #1a237e;
    }

    .subtitle {
      text-align: center;
      color: #5c6bc0;
      margin-bottom: 28px;
      font-size: 14px;
      font-weight: 500;
    }

    .auth-box {
      max-width: 420px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f7f9fb;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #edf1f5;
    }

    input, select {
      height: 46px;
      padding: 0 14px;
      border: 1px solid #c5cae9;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #3f51b5;
      box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.15);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #c5cae9;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      font-family: Arial, sans-serif;
    }

    button, .download-link {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, .download-link:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; }
    .make-btn { background: #3f51b5; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .download-link { background: #00796b; color: white; }
    .refresh-btn { background: #66bb6a; color: white; margin-top: 14px; width: 100%; }
    .edit-btn { background: #ffca28; color: #333; }
    .delete-btn { background: #ef5350; color: white; }
    .save-btn { background: #7e57c2; color: white; }
    .cancel-btn { background: #b0bec5; color: white; }

    .option-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 16px;
      background: #e8eaf6;
      border-left: 5px solid #3f51b5;
    }

    .user-info {
      font-size: 14px;
      color: #1a237e;
    }

    .label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #1a237e;
      margin-top: 14px;
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      margin-bottom: 14px;
      color: #e65100;
      font-size: 14px;
      font-weight: bold;
    }

    .result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: #f5f5f5;
      border: 1px solid #dcdcdc;
    }

    .ai-response {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e0e0e0;
      margin-bottom: 14px;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    audio { width: 100%; margin-top: 10px; }

    .list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
    }

    .item-title { margin: 0 0 6px; font-size: 18px; font-weight: bold; color: #1a237e; }
    .item-content { margin: 0; color: #555; line-height: 1.5; word-break: break-all; white-space: pre-wrap; }
    .item-date { margin-top: 8px; font-size: 12px; color: #999; }
    .item-actions { display: flex; gap: 8px; }
    .edit-box { display: grid; grid-template-columns: 1fr; gap: 8px; width: 100%; }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
      background: #f7f9fb;
      border-radius: 16px;
    }

    .hidden { display: none !important; }

    .notice, .help {
      max-width: 420px;
      margin: 20px auto 0;
      padding: 14px;
      border-radius: 14px;
      background: #fff8e1;
      color: #6d4c41;
      font-size: 14px;
      line-height: 1.6;
    }

    .help { max-width: 100%; color: #777; background: #f5f5f5; }

    @media (max-width: 700px) {
      .option-box, .item, .top-bar { grid-template-columns: 1fr; flex-direction: column; align-items: stretch; }
      .button-row { justify-content: stretch; }
      button, .download-link { width: 100%; }
      .item-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ 전기 AI 박사 & TTS 상담소</h1>
    <div class="subtitle">Firebase 로그인 데이터 연동 시스템</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일" />
        <input id="passwordInput" type="password" placeholder="비밀번호 6자리 이상" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>
      <div class="notice">
        처음 사용하는 이메일은 회원가입을 먼저 누르세요.<br />
        이미 가입한 이메일은 로그인 버튼을 누르면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">
          접속 연구원 계정: <strong id="userEmail"></strong>
        </div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="label">목소리 및 생성 설정</div>
      <div class="option-box">
        <select id="modelSelect">
          <option value="tts-1">tts-1 빠른 생성</option>
          <option value="tts-1-hd">tts-1-hd 고품질</option>
        </select>

        <select id="voiceSelect">
          <option value="onyx" selected>onyx (진중한 박사님 타입)</option>
          <option value="alloy">alloy (기본)</option>
          <option value="echo">echo</option>
          <option value="fable">fable</option>
          <option value="nova">nova</option>
          <option value="shimmer">shimmer</option>
        </select>

        <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" placeholder="말하기 속도" />
      </div>

      <div>
        <div class="label">전기 관련 질문 입력</div>
        <textarea id="textInput" placeholder="전기에 대해 궁금한 점을 질문해보세요! &#10;예: 옴의 법칙이 무엇인지 쉽게 설명해 주세요. / 교류와 직류의 차이점은 무엇인가요?"></textarea>
      </div>

      <div class="button-row">
        <button class="clear-btn" id="clearBtn">초기화</button>
        <button class="make-btn" id="makeBtn">💡 AI 박사에게 질문하기</button>
      </div>

      <div id="status" class="status"></div>

      <div id="resultBox" class="result-box hidden">
        <div class="label">👨‍🔬 AI 전기 박사의 답변</div>
        <div id="aiResponseText" class="ai-response"></div>

        <div class="label">🔊 답변 음성 듣기</div>
        <audio id="audioPlayer" controls></audio>
        <div class="button-row">
          <a id="downloadLink" class="download-link" href="#" download="electric-doctor-answer.mp3">오디오 mp3 다운로드</a>
        </div>
      </div>

      <div class="help">
        * 복잡한 질문은 AI 답변과 음성 생성에 최대 10~20초 이상 소요될 수 있습니다.<br />
        * Ctrl + Enter를 누르면 바로 질문이 전송됩니다.
      </div>

      <hr style="margin-top:40px; border:0; border-top:1px solid #c5cae9;">
      <h2 style="margin-top:20px;">📜 나의 상담 저장 목록</h2>
      <button class="refresh-btn" id="refreshBtn">데이터 새로고침</button>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getDatabase,
      ref,
      push,
      set,
      update,
      remove,
      onValue,
      off
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 💡 질문자님의 실제 Firebase 프로젝트 정보 주입 완료!
    const firebaseConfig = {
      apiKey: "AIzaSyDvDGmsuZtckupjVDm89Fr4cXQKVup3Zs0",
  authDomain: "test-7c414.firebaseapp.com",
  databaseURL: "https://test-7c414-default-rtdb.firebaseio.com",
  projectId: "test-7c414",
  storageBucket: "test-7c414.firebasestorage.app",
  messagingSenderId: "760368119906",
  appId: "1:760368119906:web:73522d647c86943117913b",
  measurementId: "G-3FDZFEWNCB"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4fXNSfeRl6RHk89WTp4M-f6n2sU0MYIkLAsinURyhM2APqDqeAXZuIP31bvEkbLPL/exec';

    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');

    const textInput = document.getElementById('textInput');
    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedInput = document.getElementById('speedInput');
    const makeBtn = document.getElementById('makeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusBox = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const aiResponseText = document.getElementById('aiResponseText');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    const refreshBtn = document.getElementById('refreshBtn');
    const dataList = document.getElementById('dataList');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function getEmailAndPassword() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요.');
        return null;
      }
      if (password.length < 6) {
        alert('비밀번호는 6자리 이상이어야 합니다.');
        return null;
      }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try {
        await createUserWithEmailAndPassword(auth, account.email, account.password);
        alert('회원가입이 완료되었습니다.');
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    loginBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try {
        await signInWithEmailAndPassword(auth, account.email, account.password);
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert('로그아웃에 실패했습니다.');
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        showMainPage(user);
        startRealtimeDataListener(user.uid);
      } else {
        currentUser = null;
        showAuthPage();
        stopRealtimeDataListener();
      }
    });

    function showMainPage(user) {
      authSection.classList.add('hidden');
      mainSection.classList.remove('hidden');
      userEmail.textContent = user.email;
      emailInput.value = '';
      passwordInput.value = '';
    }

    function showAuthPage() {
      authSection.classList.remove('hidden');
      mainSection.classList.add('hidden');
      userEmail.textContent = '';
      dataList.innerHTML = '';
      clearPage();
    }

    function startRealtimeDataListener(uid) {
      stopRealtimeDataListener();
      setStatus('상담 내역 데이터를 동기화하는 중...');

      currentItemsRef = ref(database, `users/${uid}/items`);

      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val();
        renderData(data);
        setStatus('데이터가 실시간으로 안전하게 동기화되었습니다.');
      }, (error) => {
        console.error(error);
        setStatus('데이터를 불러오지 못했습니다. Firebase Realtime Database 규칙을 확인해 보세요.');
      });
    }

    function stopRealtimeDataListener() {
      if (currentItemsRef) {
        off(currentItemsRef);
        currentItemsRef = null;
      }
    }

    refreshBtn.addEventListener('click', () => {
      if (currentUser) startRealtimeDataListener(currentUser.uid);
    });

    async function askElectricDoctor() {
      const question = textInput.value.trim();
      const model = modelSelect.value;
      const voice = voiceSelect.value;
      const speed = Number(speedInput.value || 1.0);

      if (!question) {
        alert('전기공학 박사님에게 물어볼 질문을 입력해주세요.');
        return;
      }

      if (!currentUser) {
        alert('세션이 만료되었습니다. 다시 로그인해 주세요.');
        return;
      }

      try {
        makeBtn.disabled = true;
        makeBtn.textContent = '⚡ 생성 중...';
        resultBox.classList.add('hidden');
        setStatus('⚡ AI 박사님이 답변을 생각하고 음성을 만드는 중입니다... 잠시만 기다려주세요.');

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'electric_expert_tts', 
            text: question,              
            model: model,
            voice: voice,
            speed: speed
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        if (data.responseText) {
          aiResponseText.textContent = data.responseText;
        } else {
          aiResponseText.textContent = "답변 텍스트를 불러오지 못했습니다.";
        }

        if (!data.audioBase64) throw new Error('음성 데이터를 받지 못했습니다.');

        const audioUrl = base64ToAudioUrl(data.audioBase64, 'audio/mpeg');
        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        downloadLink.download = makeFileName();
        
        resultBox.classList.remove('hidden');
        setStatus('✅ 답변 성공! 내 계정에 대화 내역을 저장하는 중...');

        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);

        await set(newItemRef, {
          title: question,
          content: data.responseText,
          createdAt: new Date().toLocaleString('ko-KR'),
          updatedAt: ''
        });

        setStatus('✅ 답변 생성 및 데이터 저장 완료!');
      } catch (error) {
        console.error(error);
        setStatus('❌ 요청 실패');
        alert('오류가 발생했습니다.\n\n' + error.message);
      } finally {
        makeBtn.disabled = false;
        makeBtn.textContent = '💡 AI 박사에게 질문하기';
      }
    }

    window.deleteData = async function(id) {
      if (!currentUser) return;
      const isConfirmed = confirm('정말 이 기록을 삭제하시겠습니까?');
      if (!isConfirmed) return;

      try {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      } catch (error) {
        console.error(error);
        alert('기록 삭제에 실패했습니다.');
      }
    };

    window.updateData = async function(id) {
      if (!currentUser) return;
      const editTitle = document.getElementById(`edit-title-${id}`).value.trim();
      const editContent = document.getElementById(`edit-content-${id}`).value.trim();

      if (!editTitle || !editContent) {
        alert('수정할 내용들을 빠짐없이 채워주세요.');
        return;
      }

      try {
        await update(ref(database, `users/${currentUser.uid}/items/${id}`), {
          title: editTitle,
          content: editContent,
          updatedAt: new Date().toLocaleString('ko-KR')
        });
      } catch (error) {
        console.error(error);
        alert('기록 수정에 실패했습니다.');
      }
    };

    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) {
        dataList.innerHTML = '<div class="empty">아직 보관된 상담 내역이 없습니다.</div>';
        return;
      }

      const entries = Object.entries(data).reverse();
      entries.forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `item-${id}`;

        div.innerHTML = `
          <div>
            <p class="item-title">❓ ${escapeHTML(item.title || '')}</p>
            <p class="item-content">👨‍🔬 ${escapeHTML(item.content || '')}</p>
            <div class="item-date">
              기록일시: ${item.createdAt || '-'}
              ${item.updatedAt ? ` / 수정일시: ${item.updatedAt}` : ''}
            </div>
          </div>
          <div class="item-actions">
            <button class="edit-btn" onclick="showEditForm('${id}', '${escapeForAttribute(item.title || '')}', '${escapeForAttribute(item.content || '')}')">수정</button>
            <button class="delete-btn" onclick="deleteData('${id}')">삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    window.showEditForm = function(id, title, content) {
      const itemBox = document.getElementById(`item-${id}`);
      itemBox.innerHTML = `
        <div class="edit-box">
          <div class="label" style="margin-top:0;">질문 수정</div>
          <input id="edit-title-${id}" type="text" value="${title}" />
          <div class="label">답변 내용 수정</div>
          <textarea id="edit-content-${id}" rows="4">${content}</textarea>
          <div class="button-row">
            <button class="cancel-btn" id="cancel-${id}">취소</button>
            <button class="save-btn" onclick="updateData('${id}')">저장하기</button>
          </div>
        </div>
      `;
      document.getElementById(`cancel-${id}`).addEventListener('click', () => {
        if (currentUser) startRealtimeDataListener(currentUser.uid);
      });
    };

    makeBtn.addEventListener('click', askElectricDoctor);
    clearBtn.addEventListener('click', clearPage);

    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        byteArrays.push(byteArray);
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }

    function makeFileName() {
      const now = new Date();
      return `electric-doctor-${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}.mp3`;
    }

    function clearPage() {
      textInput.value = '';
      setStatus('');
      aiResponseText.textContent = '';
      audioPlayer.removeAttribute('src');
      downloadLink.href = '#';
      resultBox.classList.add('hidden');
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeForAttribute(text) {
      return escapeHTML(text).replaceAll('`', '&#096;');
    }

    function getKoreanErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use': return '이미 가입된 이메일입니다.';
        case 'auth/invalid-email': return '이메일 형식이 올바르지 않습니다.';
        case 'auth/weak-password': return '비밀번호가 너무 약합니다. 6자리 이상으로 입력해주세요.';
        case 'auth/user-not-found': return '가입되지 않은 이메일입니다.';
        case 'auth/wrong-password': return '비밀번호가 올바르지 않습니다.';
        case 'auth/invalid-credential': return '이메일 또는 비밀번호가 올바르지 않습니다.';
        case 'auth/network-request-failed': return '네트워크 연결을 확인해주세요.';
        default: return `오류가 발생했습니다: ${code}`;
      }
    }

    document.addEventListener('keydown', function(event) {
      const activeId = document.activeElement.id;
      if (event.key === 'Enter' && !event.ctrlKey) {
        if (activeId === 'emailInput' || activeId === 'passwordInput') {
          loginBtn.click();
        }
      }
      if (event.key === 'Enter' && event.ctrlKey) {
        if (activeId === 'textInput') {
          askElectricDoctor();
        }
      }
    });
  </script>
</body>
</html>
